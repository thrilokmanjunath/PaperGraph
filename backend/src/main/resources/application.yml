spring:
  application:
    name: papermate
  datasource:
    url: jdbc:postgresql://localhost:5432/papermatedb
    username: papermate
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

logging:
  level:
    root: INFO
    com.papermate: DEBUG
