spring:
  application:
    name: papermate
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    # Render provides DATABASE_URL which is often just postgres://, Spring needs jdbc:postgresql://
    # Render also allows custom env vars, so we'll support both patterns with fallbacks
    url: ${JDBC_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:papermatedb}}}
    username: ${DATABASE_USERNAME:papermate}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
    # Removed explicit PostgreSQLDialect to let Spring Boot auto-detect it
    
server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.papermate: INFO
