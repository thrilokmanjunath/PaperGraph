version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: papermate-db
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-papermate}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-papermatedb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: papermate-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
